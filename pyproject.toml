[project]
name = "gemini-web-tool-calling"
version = "0.1.0"
description = "qwen-tool-calling behind a web server: FastAPI + LiteLLM + Gemini, with tool calls shown in the UI"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "litellm>=1.50",
    "google-cloud-aiplatform>=1.40.0",
    "requests>=2.31",
    "python-docx>=1.2.0",
    "beautifulsoup4>=4.15.0",
    "pypdf>=6.19.0",
    "flask>=3.1.3",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.58.0",
    "google-auth-oauthlib>=1.5.0",
]
